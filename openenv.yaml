name: content-moderation-env
version: "0.1.0"
description: >
  A realistic AI-driven social media content moderation environment.
  An agent learns to classify posts as safe/harmful and take moderation
  actions (allow / warn / remove / ban) under increasing contextual complexity.
author: participant
tags:
  - content-moderation
  - nlp
  - safety
  - social-media
  - openenv

tasks:
  - id: spam_detection
    name: Spam Detection
    difficulty: easy
    max_steps: 15
    description: >
      Detect obvious spam posts (fake prizes, clickbait, phishing links).
      Agent must remove spam and allow legitimate content.

  - id: offensive_content
    name: Offensive Content Detection
    difficulty: medium
    max_steps: 15
    description: >
      Identify and appropriately handle offensive, toxic, or abusive content.
      Agent must calibrate response severity (warn vs remove vs ban).

  - id: context_moderation
    name: Context-Based Moderation
    difficulty: hard
    max_steps: 15
    description: >
      Nuanced moderation of sarcasm, political debate, sensitive topics,
      and borderline content. Over-blocking and under-blocking are both penalized.

action_space:
  type: discrete
  values:
    - 0: allow
    - 1: warn
    - 2: remove
    - 3: ban

observation_space:
  post_text: string
  user_history:
    account_age_days: integer
    previous_violations: integer
    post_count: integer
  context:
    platform: string
    post_type: string
    reported: boolean
  extracted_features:
    has_spam_keywords: boolean
    has_offensive_words: boolean
    toxicity_score: float
    sentiment_score: float
    has_urls: boolean
    caps_ratio: float
  step: integer
  task_id: string
  label: string

reward_range: [-2.0, 1.2]
